<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <header class="game-header">
        <h1 id="game-title">2048</h1>
        <div class="game-actions">
          <div class="score-box" aria-live="polite">
            <span>현재 점수</span>
            <strong id="score">0</strong>
          </div>
          <button id="new-game" class="new-game-button" type="button">새 게임</button>
        </div>
      </header>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="2048 게임 보드"></div>
        <div id="message" class="message" role="dialog" aria-modal="true" aria-labelledby="message-title" hidden>
          <div class="message-card">
            <h2 id="message-title"></h2>
            <p id="message-text"></p>
            <div class="message-actions">
              <button id="continue-game" type="button">계속하기</button>
              <button id="restart-game" type="button">새 게임</button>
            </div>
          </div>
        </div>
      </div>

      <div class="direction-controls" aria-label="이동 버튼">
        <button class="direction-button direction-up" type="button" data-direction="up" aria-label="위로 이동">↑</button>
        <button class="direction-button direction-left" type="button" data-direction="left" aria-label="왼쪽으로 이동">←</button>
        <button class="direction-button direction-down" type="button" data-direction="down" aria-label="아래로 이동">↓</button>
        <button class="direction-button direction-right" type="button" data-direction="right" aria-label="오른쪽으로 이동">→</button>
      </div>

      <p class="instructions">방향키 또는 아래 버튼으로 타일을 움직이세요. 같은 숫자를 합쳐 2048을 만들면 승리합니다.</p>
    </main>
  </body>
</html>
